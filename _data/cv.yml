cv:
  name: Gerardo Roa-Dabike
  label: Machine Learning Researcher -- Speech & Audio
  website: https://www.gerardoroadabike.com/
  location: Sheffield, UK
  image: prof_pic2.jpg
  summary: >-
    Machine learning researcher specialising in deep learning for speech and
    audio, including speech separation, speech enhancement, and noise
    cancellation. PhD in Computer Science with a focus on speech and audio
    processing, and a track record of designing, implementing, and evaluating ML
    systems -- from CNN and transformer-based models to full evaluation
    frameworks and benchmarks -- for real-world audio applications, published in
    peer-reviewed venues. Experienced in translating research into deployable
    systems through cross-functional and industry collaboration.


    Projects:
      - name: CAD1
        summary: Machine learning challenge to improve music listening for people with hearing impairment.
        highlights:
          - Co-developed the first Cadenza Challenge with headphone and in-car listening scenarios.
          - Contributed to baselines, evaluation methodology, and open benchmark data release.

      - name: ICASSP 2024
        summary: Personalised remixing of music for hearing aid users, accounting for loudspeaker cross-talk.
        highlights:
          - Extended Cadenza to a more realistic loudspeaker listening scenario.
          - Supported evaluation using HAAQI on listener-personalised remixed stereo signals.

      - name: PhD Project
        summary: Deep Learning Approaches for Automatic Sung Speech Recognition
        highlights:
          - Focused on adapting spoken speech technologies to sung speech.
          - Covered dataset creation, vocal source separation, acoustic modelling, and lyric transcription.


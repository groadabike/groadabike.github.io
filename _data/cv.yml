    Experience:
      - company: University of Sheffield, UK & University of Salford, UK
        position: Cadenza Project - Research Associate - ML Challenge Lead
        location: Uk
        start_date: 2022-06
        end_date: present
        summary: >-
          Led the design and delivery of international machine learning
          challenges on audio enhancement and speech separation for hearing-aid
          users.
        highlights:
          - Led the design and delivery of 5 international ML challenges on audio enhancement and speech separation for hearing-aid users.
          - Designed and implemented baseline ML systems for speech separation and enhancement using CNN- and transformer-based architectures.
          - Benchmarked systems against real-time inference and latency constraints alongside challenge submissions.
          - Defined data strategies and rigorous evaluation frameworks for large-scale research initiatives across academic and industry partners.

      - company: University of Sheffield
        position: COVID-OSA Project - Research Associate - Data Analytics Lead
        location: UK
        start_date: 2022-02
        end_date: 2024-01
        summary: >-
          Led data collection and analytical activities for a study on the
          relationship between obstructive sleep apnoea and COVID-19 outcomes.
        highlights:
          - Applied signal processing and statistical analysis to clinical and physiological data.
          - Curated a clinical dataset from 120 long-COVID and OSA patients that remains in active use by other researchers.

      - company: LarrainVial S.A.
        position: Deputy Manager, Business Intelligence
        location: Chile
        start_date: 2004
        end_date: 2017
        summary: >-
          Led business intelligence operations and data infrastructure at a
          leading Chilean financial services firm.
        highlights:
          - Consolidated multiple product databases into a unified analytics platform.
          - Designed KPIs to benchmark 50--100 financial advisors.
          - Directed cross-departmental innovation projects.

